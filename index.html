<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IMPERIUM MOTORS | Where Luxury Meets Legacy</title>

<!-- FAST TAILWIND -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">

<!-- GOOGLE FONTS -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;600;700&family=Alex+Brush&display=swap" rel="stylesheet">

<!-- MAIN CSS -->
<link rel="stylesheet" href="style.css">

<!-- PRELOAD IMAGES -->
<link rel="preload" as="image" href="SHIELD_ONLY.png">
<link rel="preload" as="image" href="i_SDG.png">
<link rel="preload" as="image" href="IMPERIUM_MOTORS_NOSHIELD.png">
<link rel="preload" as="image" href="FUTURE_DESIGN.webp">

</head>

<body>

<!-- INTRO -->
<div id="intro-screen">

    <div id="intro-shield-wrapper">

        <img src="SHIELD_ONLY.png"
             id="intro-shield-frame"
             alt="Shield">

        <img src="i_SDG.png"
             id="intro-shield-logo"
             alt="Imperium">

    </div>

    <h1 id="imperium-title">
        IMPERIUM MOTORS
    </h1>

    <div id="legacy-text">
        Soli Deo Gloria
    </div>

</div>

<!-- WEBSITE -->
<div id="main-content">

    <!-- NAVBAR -->
    <nav id="navbar">

        <div class="nav-left">

            <div class="nav-branding-zone">

                <div id="nav-logo-space"></div>

                <img src="IMPERIUM_MOTORS_NOSHIELD.png"
                     id="nav-brand-text"
                     alt="Imperium Motors">

            </div>

        </div>

        <div class="nav-links">

            <a href="#about">OUR IDENTITY</a>
            <a href="#portfolio">THE VAULT</a>
            <a href="#spaces">THE ESTATES</a>
            <a href="#club">ELITE CIRCLE</a>

            <a href="#appointment" class="nav-button">
                PRIVATE BRIEFING
            </a>

        </div>

    </nav>

    <!-- HERO -->
    <section id="hero">

        <div id="hero-bg"></div>

        <div id="hero-overlay"></div>

        <div id="hero-content">

            <p class="hero-subtitle">
                SOLI DEO GLORIA
            </p>

            <h2>
                Where Luxury Meets Legacy
            </h2>

            <div class="hero-line"></div>

            <p class="hero-description">
                Connecting discerning global visionaries through the procurement of the world's rarest automotive investments.
            </p>

            <div class="hero-buttons">

                <a href="#appointment" class="hero-gold-btn">
                    SECURE ENTRY
                </a>

                <a href="#portfolio" class="hero-outline-btn">
                    VIEW VAULT
                </a>

            </div>

        </div>

    </section>

</div>

<script>

function runCinematicIntro(){

    const logoWrapper = document.getElementById('intro-shield-wrapper');

    const introTitle = document.getElementById('imperium-title');

    const introSub = document.getElementById('legacy-text');

    const introScreen = document.getElementById('intro-screen');

    const mainContent = document.getElementById('main-content');

    const navText = document.getElementById('nav-brand-text');

    introTitle.classList.add('fade-out');

    introSub.classList.add('fade-out');

    setTimeout(() => {

        logoWrapper.classList.add('fly-to-corner');

        introScreen.classList.add('intro-fade');

        mainContent.classList.add('show-main');

    }, 700);

    setTimeout(() => {

        navText.classList.add('show-nav-text');

    }, 1800);

    setTimeout(() => {

        introScreen.style.display = 'none';

    }, 2600);
}

window.addEventListener('load', () => {

    setTimeout(runCinematicIntro, 1200);

});

</script>

</body>
</html>
