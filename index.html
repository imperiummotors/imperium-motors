<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
IMPERIUM MOTORS | Where Luxury Meets Legacy
</title>

<!-- FONTS -->

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&family=Alex+Brush&display=swap" rel="stylesheet">

<!-- CSS -->

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- ===================================== -->
<!-- INTRO SCREEN -->
<!-- ===================================== -->

<div id="intro-stage">

    <!-- SHIELD SYSTEM -->

    <div id="intro-shield-wrapper">

        <!-- SPINNING SHIELD -->

        <img
            src="SHIELD_ONLY.png"
            id="intro-shield-frame"
            alt="Shield"
        >

        <!-- STATIC CENTER -->

        <img
            src="i_SDG.png"
            id="intro-shield-logo"
            alt="Imperium Identity"
        >

    </div>

    <!-- TEXT -->

    <div id="intro-text-element">

        <h1>
            IMPERIUM MOTORS
        </h1>

        <p>
            Soli Deo Gloria
        </p>

    </div>

</div>

<!-- ===================================== -->
<!-- MAIN WEBSITE -->
<!-- ===================================== -->

<div id="main-content">

    <!-- NAVBAR -->

    <nav id="navbar">

        <div id="nav-left">

            <div id="nav-logo-container">

                <img
                    src="SHIELD_ONLY.png"
                    id="nav-shield"
                    alt="Shield"
                >

                <img
                    src="i_SDG.png"
                    id="nav-center"
                    alt="Center Logo"
                >

            </div>

            <img
                src="IMPERIUM_MOTORS.png"
                id="nav-title"
                alt="Imperium Motors"
            >

        </div>

        <div id="nav-links">

            <a href="#about">Identity</a>

            <a href="#vault">Vault</a>

            <a href="#estate">Estates</a>

            <a href="#circle">Elite Circle</a>

        </div>

    </nav>

    <!-- HERO SECTION -->

    <section id="hero-section">

        <!-- BACKGROUND -->

        <div id="hero-background">

            <img
                src="FUTURE_DESIGN.webp"
                alt="Imperium Headquarters"
            >

        </div>

        <!-- DARK OVERLAY -->

        <div id="hero-overlay"></div>

        <!-- HERO CONTENT -->

        <div id="hero-content">

            <p id="hero-subtitle">
                SOLI DEO GLORIA
            </p>

            <h2 id="hero-title">

                Where
                <span>Luxury</span>

                Meets

                <span>Legacy</span>

            </h2>

            <div id="hero-line"></div>

            <p id="hero-description">

                Private hypercar brokerage,
                luxury automotive acquisition,
                and elite collector ecosystem
                built on discretion, prestige,
                and generational legacy.

            </p>

            <div id="hero-buttons">

                <a href="#vault" class="gold-btn">
                    ENTER THE VAULT
                </a>

                <a href="#circle" class="outline-btn">
                    PRIVATE ACCESS
                </a>

            </div>

        </div>

    </section>

</div>

<!-- ===================================== -->
<!-- JAVASCRIPT -->
<!-- ===================================== -->

<script src="script.js"></script>

</body>

</html>
